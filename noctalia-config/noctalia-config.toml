[audio]
enable_sounds = true

[bar.default]
center = []
end = [
    "seperator",
    "media",
    "seperator",
    "wallhaven",
    "wallpaper",
    "caffeine",
    "seperator",
    "CPU",
    "cpu",
    "seperator",
    "GPU",
    "ram",
    "seperator",
    "VOL",
    "volume",
    "seperator",
    "clock",
    "seperator"
]
font_family = "JetBrains Mono"
margin_ends = 0
padding = 0
radius = 0
start = [ "seperator", "session", "workspaces", "seperator", "audio_visualizer", "seperator" ]
thickness = 30

[brightness]
enable_ddcutil = true

[desktop_widgets]
enabled = false

[dock]
enabled = true
icon_size = 35
item_spacing = 0
main_axis_padding = 0
margin_edge = 5
pinned = [
    "thunar",
    "kitty",
    "vesktop",
    "spotify",
    "firefox",
    "helium",
    "org.kde.krita",
    "lgl-emoji-picker",
    "com.obsproject.Studio",
    "vlc",
    "md.obsidian.Obsidian",
    "org.vinegarhq.Sober",
    "org.prismlauncher.PrismLauncher",
    "steam"
]
shadow = false
show_dots = true
show_instance_count = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugin_settings."noctalia/wallhaven"]
api_key = "q4b2z5EY58iPcTd30qm9BiiQcHqmyvp1"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/luna/Pictures/WH40k/scribbledvohl.png"
font_family = "JetBrains Mono"

    [shell.mpris]
    blacklist = [ "firefox" ]

    [shell.panel]
    control_center_placement = "floating"

[theme]
builtin = "Ayu"
community_palette = "GruvboxAlt"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty" ]
    community_ids = [ "prismlauncher", "fuzzel", "obs" ]

[wallpaper.default]
path = "/home/luna/Pictures/Wallpapers/wh40k/adepta sororitas.png"

[wallpaper.last]
