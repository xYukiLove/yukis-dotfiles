# More option see https://github.com/DreamMaoMao/mango/wiki/
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_CURRENT_SESSION_TYPE,wayland
env=SDL_VIDEODRIVER,wayland
env=XDG_DESKTOP_PORTAL,mango
env=QT_QPA_PLATFORMTHEME,qt6ct
exec_once=waybar
exec_once=dunst
exec_once=firefox
exec_once=spotify
exec_once=equibop
exec_once=xdg-desktop-portal-wlr
exec_once=xdg-desktop-portal
exec_once=/usr/lib/xdg-desktop-portal -r
#exec=swaybg -i /home/allie/Pictures/Wallpapers/Other\ Animes/wallhaven-76eooo_2560x1440.png -m fill
#exec=swaybg -i /home/allie/Pictures/Wallpapers/Monogatari/wallhaven_qzv667.jpg -m fill
exec=swaybg -i /home/allie/Pictures/Wallpapers/Final\ Fantasy/00000297.jpg -m fill
monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:480,x:0,y:0,rr:0
#monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:240,x:-1920,y:0,rr:0

# Window effect
blur=1
blur_layer=0
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.0

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadows_color= 0x000000ff

border_radius=0 #6
no_radius_when_single=0
focused_opacity=0.9 #0.9
unfocused_opacity=0.8 #0.8

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.5
default_master_count=1
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
cursor_hide_timeout=0
cursor_theme=Shinobu-Oshino
cursor_size=32
mouse_accel_profile=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1
tag_num=5
# keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
swipe_min_threshold=1

mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5 #5
gap_inner_vertical=5
gap_outer_horizontal=5  #10
gap_outer_vertical=5   #10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3  #4
root_color = 0x1f1f28ff
border_color = 0x526e7cff
drop_color = 0xc4b28a80
split_color = 0x938aa9ff
focus_color = 0xc4b28aff
maximized_screen_color = 0x8ea49eff
urgent_color = 0xc4746eff
scratchpad_color = 0x938aa9ff
global_color = 0x735c28ff
overlay_color = 0x2f5047ff
jump_label_decorate_fg_color = 0xdcd7baff
jump_label_decorate_bg_color = 0x333343ff
jump_label_decorate_focus_fg_color = 0x1f1f28ff
jump_label_decorate_focus_bg_color = 0xc4b28aff
jump_label_decorate_border_color = 0x526e7cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,monitor_name:DP-1,layout_name:tile
tag_rule=id:2,monitor_name:DP-1,layout_name:scroller
tag_rule=id:3,monitor_name:DP-1,layout_name:scroller
tag_rule=id:4,monitor_name:DP-1,layout_name:tile
tag_rule=id:5,monitor_name:DP-1,layout_name:tile

tag_rule=id:1,monitor_name:DP-2,layout_name:scroller
tag_rule=id:2,monitor_name:DP-2,layout_name:scroller
tag_rule=id:3,monitor_name:DP-2,layout_name:scroller
tag_rule=id:4,monitor_name:DP-2,layout_name:tile
tag_rule=id:5,monitor_name:DP-2,layout_name:tile
# Window Rules
window_rule=tags:2,app_id:equibop
window_rule=tags:3,app_id:Spotify
window_rule=tags:1,app_id:firefox
window_rule=app_id:firefox,blur=1
window_rule=app_id:Spotify,isfakefullscreen
window_rule=app_id:kitty,ignore_maximize:1
window_rule=app_id:ghostty,ignore_maximize:1

# Opacity Rules
window_rule=focused_opacity:1.0,app_id:org.prismlauncher.PrismLauncher
window_rule=unfocused_opacity:1.0,app_id:org.prismlauncher.PrismLauncher
window_rule=focused_opacity:1.0,app_id:steam
window_rule=opacity 1.0,title:^(steam_app_.*)$
window_rule=unfocused_opacity:1.0,app_id:steam
window_rule=focused_opacity:1.0,app_id:prismlauncher
window_rule=unfocused_opacity:1.0,app_id:prismlauncher
window_rule=focused_opacity:0.9,no_blur:1,app_id:kitty
window_rule=unfocused_opacity:0.8,no_blur:1,app_id:kitty
window_rule=focused_opacity:0.9,no_blur:1,app_id:Spotify
window_rule=unfocused_opacity:0.8,no_blur:1,app_id:Spotify
window_rule=no_blur:1,app_id:grim
window_rule=no_blur:0,app_id:slurp
window_rule=focused_opacity:1.0,app_id:Sober
window_rule=unfocused_opacity:1.0,app_id:Sober
window_rule=focused_opacity:1.0,title:Minecraft
window_rule=unfocused_opacity:1.0,title:Minecraft
# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

bind=NONE,Print,spawn,sh -c 'grim -g "$(slurp)" - | wl-copy'
# Core binds
bind=SUPER,period,spawn,noctalia msg panel-toggle liamwh/emoji-picker:wide
bind=SUPER,d,spawn,fuzzel
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
#bind=SUPER,d,spawn,fuzzel
#bind=SUPER+SHIFT,d,spawn,rofi -show filebrowser
bind=SUPER,Return,spawn,kitty
bind=SUPER,x,spawn,wlogout
bind=SUPER,b,spawn,firefox


# exit
bind=SUPER+SHIFT,e,quit
bind=SUPER,q,killclient,
#bind=SUPER,p,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusdir,up
bind=SUPER,k,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,m,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=ALT,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=ALT,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

#bind=SUPER,q,view,1,0
#bind=SUPER,w,view,2,0
#bind=SUPER,e,view,3,0
#bind=SUPER,r,view,4,0
#bind=SUPER,t,view,5,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0

#bind=SUPER+SHIFT,q,tag,1,0
#bind=SUPER+SHIFT,w,tag,2,0
#bind=SUPER+SHIFT,e,tag,3,0
#bind=SUPER+SHIFT,r,tag,4,0
#bind=SUPER+SHIFT,t,tag,5,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layer_rule=animation_type_open:zoom,layer_name:fuzzel
layer_rule=animation_type_close:zoom,layer_name:fuzzel

source=~/.config/mango/noctalia.conf
